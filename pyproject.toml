[tool.poetry]
name = "transaction-analyzer"
version = "0.1.0"
description = "Консольное приложение для анализа банковских транзакций"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.1.1"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
requests = "^2.34.2"
python-dotenv = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
flake8 = "^7.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
